version: 2

models:
  - name: dim_departments
    description: "Dimension table of all city departments with request volume - intermediate layer"
    columns:
      - name: department_key
        description: "Surrogate key generated by row_number() for department dimension"
        tests:
          - unique
          - not_null
      - name: department
        description: "City department name. Note: nullable - Edmonton API does not always assign a department at request creation stage"
        tests:
          - unique
      - name: total_requests
        description: "Total requests received by this department across all time"
        tests:
          - not_null

  - name: int_request_metrics
    description: "Intermediate metrics table - calculates days to resolution per request"
    columns:
      - name: request_number
        description: "Unique request identifier"
        tests:
          - unique
          - not_null
      - name: days_to_resolution
        description: "Number of days between request creation and status date"
      - name: status_category
        description: "Grouped status: Resolved, Closed - Not Resolved, Open, Unknown"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Resolved', 'Closed - Not Resolved', 'Open', 'Unknown']