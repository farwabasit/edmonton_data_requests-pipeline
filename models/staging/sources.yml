version: 2

sources:
  - name: bronze
    database: edmonton_analytics
    schema: bronze
    config:
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 25, period: hour}
      loaded_at_field: ingested_at
    tables:
      - name: edmonton_requests_raw
        description: "Raw JSON data ingested from Edmonton Open Data API via ADF every 6 hours"