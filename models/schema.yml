version: 2

models:
  - name: stg_requests
    description: "Cleaned Edmonton API data - JSON parsed into columns, nulls filtered"
    columns:
      - name: request_number
        description: "Unique identifier for each data request"
        tests:
          - unique
          - not_null
      - name: department
        description: "City department responsible for the request"
        tests:
          - not_null
      - name: status
        description: "Current status of the request"
        tests:
          - accepted_values:
              arguments:
                values: ['New', 'Under Review', 'In Progress', 'On Hold', 'Completed', 'Cancelled', 'Declined', 'Rejected']

  - name: fct_requests_by_dept
    description: "Request counts aggregated by department and status"
    columns:
      - name: request_count
        description: "Total number of requests"
        tests:
          - not_null